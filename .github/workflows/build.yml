name: Build PlayZupi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project structure
        run: |
          cp lib/main.dart /tmp/playzupi_main.dart
          flutter create --project-name playzupi --platforms=android .
          cp /tmp/playzupi_main.dart lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Install launcher icon generator
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure PlayZupi launcher icon
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "playzupi_icon.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "playzupi_icon.png"
          EOF

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayZupi-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
